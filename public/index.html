<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lulora Tech</title>
  <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
  <header>
    <a href="/">Lulora Tech</a>
    <nav id="menu"><a href="/login.html">Entrar</a><a href="/cadastro.html">Criar conta</a></nav>
  </header>
  <main class="largo">
    <div class="barra">
      <input type="search" id="busca" placeholder="Buscar produtos" aria-label="Buscar produtos">
    </div>
    <div id="mensagem" class="mensagem" role="alert"></div>
    <section id="catalogo" class="catalogo" aria-live="polite"></section>
    <p id="vazio" class="dica" hidden>Nenhum produto encontrado.</p>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const catalogo = document.getElementById("catalogo");
    const busca = document.getElementById("busca");
    const mensagem = document.getElementById("mensagem");
    let logado = false;

    // RF-C01 / RNF-C01: adiciona ao carrinho sem recarregar a página.
    async function adicionarAoCarrinho(produto, botao) {
      if (!logado) {
        window.location.href = "/login.html";
        return;
      }
      botao.disabled = true;
      limparMensagem(mensagem);
      try {
        const carrinho = await Api.requisitar("/api/carrinho/itens", {
          metodo: "POST",
          corpo: { produto_id: produto.id, quantidade: 1 },
        });
        atualizarContadorCarrinho(carrinho.quantidade_itens);
        botao.textContent = "Adicionado ✓";
        setTimeout(() => { botao.textContent = "Adicionar ao carrinho"; }, 1500);
      } catch (erro) {
        if (erro.status === 401) return (window.location.href = "/login.html");
        mostrarMensagem(mensagem, "erro", erro.message);
      } finally {
        botao.disabled = false;
      }
    }

    function cartao(produto) {
      const item = document.createElement("article");
      item.className = "produto";

      if (produto.imagem_url) {
        const img = document.createElement("img");
        img.src = produto.imagem_url;
        img.alt = produto.nome;
        img.loading = "lazy";
        item.appendChild(img);
      } else {
        const sem = document.createElement("div");
        sem.className = "sem-imagem";
        sem.textContent = "Sem imagem";
        item.appendChild(sem);
      }

      const info = document.createElement("div");
      info.className = "info";
      const nome = document.createElement("strong");
      nome.textContent = produto.nome;
      const preco = document.createElement("span");
      preco.className = "preco";
      preco.textContent = formatarPreco(produto.preco);
      const estoque = document.createElement("span");
      estoque.className = "dica";
      estoque.textContent = produto.estoque_disponivel > 0 ? `${produto.estoque_disponivel} em estoque` : "Esgotado";
      info.append(nome, preco, estoque);
      if (produto.descricao) {
        const descricao = document.createElement("span");
        descricao.className = "dica";
        descricao.textContent = produto.descricao;
        info.appendChild(descricao);
      }
      const botao = document.createElement("button");
      botao.type = "button";
      botao.textContent = produto.estoque_disponivel > 0 ? "Adicionar ao carrinho" : "Esgotado";
      botao.disabled = produto.estoque_disponivel <= 0;
      botao.style.marginTop = "auto";
      botao.addEventListener("click", () => adicionarAoCarrinho(produto, botao));
      info.appendChild(botao);
      item.appendChild(info);
      return item;
    }

    async function carregar() {
      const parametros = new URLSearchParams({ limite: "100" });
      if (busca.value.trim()) parametros.set("busca", busca.value.trim());
      try {
        const pagina = await Api.requisitar(`/api/produtos?${parametros}`, { autenticado: false });
        catalogo.replaceChildren(...pagina.itens.map(cartao));
        document.getElementById("vazio").hidden = pagina.itens.length > 0;
      } catch (erro) {
        mostrarMensagem(mensagem, "erro", erro.message);
      }
    }

    let temporizador;
    busca.addEventListener("input", () => {
      clearTimeout(temporizador);
      temporizador = setTimeout(carregar, 300);
    });

    (async () => {
      logado = Boolean(await montarMenu(document.getElementById("menu")));
      if (logado) {
        Api.requisitar("/api/carrinho").then((c) => atualizarContadorCarrinho(c.quantidade_itens)).catch(() => {});
      }
    })();
    carregar();
  </script>
</body>
</html>
